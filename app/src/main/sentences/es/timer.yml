set:
  - (configura|establece|pon) (un )?temporizador (de |para )?.duration.
  - (configura|establece|pon) (un )?temporizador (de |para )?.duration. (con nombre|llamado|con el nombre) .name.
  - (configura|establece|pon) (un )?temporizador (llamado|con el nombre) .name. (de |para )?.duration.
  - temporizador (de |para )?.duration.

cancel:
  - (cancela|detén|para) (el |los )?temporizador(es)?.
  - (cancela|detén|para) (el )?temporizador .name.
  - (cancela|detén|para) todos los temporizadores.

query:
  - (cuánto (tiempo )?(queda|falta)|cuál es el estado) (del |de los )?temporizador(es)?.
  - (cuánto (tiempo )?(queda|falta)|cuál es el estado) (del )?temporizador .name.
  - (cuándo (termina|finaliza)|a qué hora (termina|finaliza)) (el |los )?temporizador(es)?.
  - (cuándo (termina|finaliza)|a qué hora (termina|finaliza)) (el )?temporizador .name.
