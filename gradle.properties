# ============================================
# CONFIGURACIÓN DE MEMORIA (Optimizado)
# ============================================
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# ============================================
# CONFIGURACIÓN ANDROID
# ============================================
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
android.nonFinalResIds=true
android.defaults.buildfeatures.buildconfig=true
android.enableR8.fullMode=true

# ============================================
# CONFIGURACIÓN KOTLIN
# ============================================
kotlin.code.style=official
kotlin.incremental=true
kotlin.incremental.java=true
kotlin.incremental.js=true
kotlin.caching.enabled=true
kotlin.parallel.tasks.in.project=true

# ============================================
# OPTIMIZACIONES DE BUILD
# ============================================
org.gradle.configureondemand=true
org.gradle.vfs.watch=true
org.gradle.workers.max=4

# ============================================
# DESHABILITAR ADVERTENCIAS INNECESARIAS
# ============================================
android.suppressUnsupportedCompileSdk=34,35,36
android.injected.testOnly=false

# ============================================
# CONFIGURACIÓN PARA PLUGINS PERSONALIZADOS
# ============================================
# Necesario para plugins como dicio.sentences.compiler
kotlin.native.ignoreDisabledTargets=true
kotlin.mpp.androidSourceSetLayoutVersion=2
